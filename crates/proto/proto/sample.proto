syntax = "proto3";

package helloworld;

// Because i always forget how to do this
// .\grpcurl.exe -plaintext -d '{"name": "KHALLAAAAA"}' -import-path H:\rust-hybrid-server\crates\proto\proto -proto sample.proto localhost:6003 helloworld.Greeter/SayHello

// The greeting service definition.
service Greeter {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings
message HelloReply {
  string message = 1;
}
